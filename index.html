<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Flag Project</title>
  <style>
    .flag {
      width:900px;
      height:600px;
      background-color:#ce1126;
      position:relative;
    }
    .flag > div{
      background-color: #002868;
      position:absolute;
      height: 50%;
      width:100%;
      position:absolute;
      top: 25%; 
    }

    .flag > div > div{
      background-color: white;
      height:200px;
      width:200px;
      border-radius: 50%;
      text-align: center;
      position:absolute;
      top:16.67%;
      left:38.8%;
      
    }
    
     p{
      margin:0px;
      font-size: 500%;
      text-align: center;
    }

    .flag > p{
      color:azure;
    }


  </style>
</head>

<!-- 
  IMPORTANT! Do not change any HTML
Don't add any classes/ids/elements 
Use what you know about combining selectors 
and CSS specificity instead.
Hint 1: The flag is 900px by 600px and the circle is 200px by 200px.
Hint 2: You can use CSS inspection to get the colors from
https://appbrewery.github.io/flag-of-laos/
-->

<body>
  <div class="flag">
    <p>The Flag</p>
    <div>
      <div>
        <p>of Laos</p>
      </div>
    </div>
  </div>
</body>

</html>
